<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Account-a-Bill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column of frosted-glass panels over a black faceted (low-poly) backdrop with red light */
:root{--bg:#07070a;--card:rgba(255,255,255,.055);--card-hi:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);--fg:#f4eeee;--mute:#a69a9c;--acc:#e11d2e;--acc2:#ff5a5f;--acc-fg:#ffffff;--ok:#5ee0a8;--bad:#ff6b6b;--track:rgba(255,255,255,.1);--field:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background-color:var(--bg);
 background-image:
  linear-gradient(135deg,rgba(225,29,46,.34) 0%,rgba(225,29,46,0) 38%),
  linear-gradient(225deg,rgba(255,90,95,.2) 0%,rgba(255,90,95,0) 30%),
  linear-gradient(60deg,transparent 0 46%,rgba(255,255,255,.03) 46% 54%,transparent 54%),
  linear-gradient(120deg,transparent 0 62%,rgba(225,29,46,.10) 62% 70%,transparent 70%),
  linear-gradient(200deg,transparent 0 40%,rgba(255,255,255,.035) 40% 47%,transparent 47%);
 background-attachment:fixed;
 color:var(--fg);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
main>*{min-width:0;max-width:100%}
.brand{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.brand i{width:22px;height:22px;background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#7a0a14);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);display:block}
.brand b{color:var(--fg);letter-spacing:.22em}
h1{font-size:26px;margin:4px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;margin:0}
.card{position:relative;background:linear-gradient(145deg,var(--card-hi),var(--card));border:1px solid var(--line);border-top-color:rgba(255,255,255,.28);border-radius:4px 18px 4px 18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.card::after{content:"";position:absolute;top:0;right:0;width:44px;height:44px;background:linear-gradient(225deg,rgba(225,29,46,.55),transparent 60%);border-radius:0 18px 0 0;pointer-events:none;clip-path:polygon(0 0,100% 0,100% 100%)}
.card.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px}
.big{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.bar{height:8px;background:var(--track);border-radius:2px;overflow:hidden;transform:skewX(-20deg)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7a0a14,var(--acc),var(--acc2))}
button{font:inherit;border:1px solid rgba(255,255,255,.22);border-radius:3px 12px 3px 12px;padding:10px 14px;background:linear-gradient(135deg,var(--acc2),var(--acc) 60%,#9d1020);color:var(--acc-fg);font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(225,29,46,.35)}
button:active{transform:translateY(1px)}
button.ghost{background:rgba(255,255,255,.04);color:var(--fg);border-color:var(--line);box-shadow:none}
button.danger{background:transparent;color:var(--bad);border-color:var(--line);box-shadow:none}
button.sm{padding:6px 10px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
input,textarea{font:inherit;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:10px;border-radius:3px 10px 3px 10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
input::placeholder{color:#7d7274}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:16px}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:8px;min-width:0}
.grid>*{min-width:0}
input[type=date]{min-height:44px;text-align:left}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.item{padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.item>div{min-width:0;overflow-wrap:anywhere}
.pos{color:var(--ok)}.neg{color:var(--bad)}.misc{color:#ffb347}
a.back{color:var(--acc2);text-decoration:none;font-weight:600}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;justify-content:center}
#toast span{background:var(--acc);color:#fff;padding:10px 14px;border-radius:3px 12px 3px 12px;font-size:14px;max-width:560px}
label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:14px}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;margin-left:8px;border:1px solid var(--ok);color:var(--ok);border-radius:2px 6px 2px 6px;font-weight:600;vertical-align:middle}
.item .btns{flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
.item.edit{display:block}
.item.edit>*+*{margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:none}
.day{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-weight:600}
.day:first-of-type{border-top:0;margin-top:0;padding-top:0}
.item.k-m{border-left:3px solid var(--ok);padding-left:10px}
.item.k-s{border-left:3px solid var(--bad);padding-left:10px}
.item.k-t{border-left:3px solid #6ab7ff;padding-left:10px}
.blue{color:#6ab7ff}
.purple{color:#b794f6}
.item.k-i{border-left:3px solid #2dd4bf;padding-left:10px}
.item.k-p{border-left:3px solid #b794f6;padding-left:10px}
select{font:inherit;width:100%;min-width:0;padding:10px;border-radius:3px 10px 3px 10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
option{background:#16161b;color:#fff}
.item.k-x{border-left:3px solid #ffb347;padding-left:10px}
.chip{border-radius:3px 12px 3px 12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:6px 10px;font-size:14px;font-weight:600;box-shadow:none;color:var(--fg)}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc) 60%,#9d1020);color:#fff;border-color:rgba(255,255,255,.22)}
.chip.pos,.chip.neg,.chip.misc{background:rgba(255,255,255,.04)}
.chip.on.pos,.chip.on.neg,.chip.on.misc{color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc) 60%,#9d1020)}
.sum{display:flex;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
table.stubt{width:100%;border-collapse:collapse;font-size:14px}
.stubt th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600}
.stubt td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:break-word;word-break:normal}
.stubt .r{text-align:right;white-space:nowrap}
.stubt tr.tot td{font-weight:700}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.stubt{font-size:12.5px}.stubt td.r{font-size:12px;letter-spacing:-.01em}.stubt th,.stubt td{padding:5px 2px}.stubt td:first-child{hyphens:auto;-webkit-hyphens:auto}}
@media (max-width:360px){.stubt{font-size:12.5px}.stubt th,.stubt td{padding:5px 2px}.stubt th{font-size:10px;letter-spacing:.04em}.big{font-size:34px}h1{font-size:23px}.parties{grid-template-columns:1fr}}
.stubt{table-layout:auto;max-width:100%}
.parties h3{margin:0 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.metag{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
@media print{
 .stubt td,.stubt th{border-color:#bbb}
 :root{color-scheme:light}
 body{background:#fff!important;color:#000;padding:0}
 .noprint{display:none!important}
 .card{background:#fff;border:1px solid #888;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:#000;border-radius:4px}
 .card::after{display:none}
 .mute{color:#444}.pos,.neg,.misc{color:#000}.tag{color:#000;border-color:#000}
 .item,.sum{border-color:#bbb}
}
</style>
<main id="app"></main>
<div id="toast" hidden><span id="toastText"></span></div>
<script>
(function(){
'use strict';
var KEY='goaltracker.v1';
var state=load();
var view={page:'list',id:null,form:null,backup:false,armed:null};

function load(){
  var s={goals:[]};
  try{var raw=localStorage.getItem(KEY);if(raw&&!localStorage.getItem(KEY+'.pretax'))localStorage.setItem(KEY+'.pretax',raw)}catch(e){}
  var keys=[KEY,KEY+'.bak',KEY+'.pretax'];
  for(var i=0;i<keys.length;i++){
    try{var x=JSON.parse(localStorage.getItem(keys[i]));if(x&&Array.isArray(x.goals)&&x.goals.length){s=x;break}}catch(e){}
  }
  s.goals.forEach(function(g){
    if(!g.made){g.made=g.entries||[];g.spent=[];g.target=g.budget||0;delete g.entries;delete g.adjustments;delete g.budget}
    if(!g.spent)g.spent=[];
    if(!g.misc)g.misc=[];
    if(!g.taxonly)g.taxonly=[];
    if(!g.taxpay)g.taxpay=[];
    if(!g.subs)g.subs=[];
  });
  if(!s.profile)s.profile={name:'',payer:''};
  if(!s.profile.filing)s.profile.filing='single';
  if(s.profile.credits==null)s.profile.credits=0;
  if(!Array.isArray(s.manual))s.manual=[];
  return s;
}
function idb(cb){try{var r=indexedDB.open('accountabill',1);r.onupgradeneeded=function(){r.result.createObjectStore('s')};r.onsuccess=function(){cb(r.result)}}catch(e){}}
function idbPut(j){idb(function(db){try{db.transaction('s','readwrite').objectStore('s').put(j,'latest')}catch(e){}})}
function idbGet(cb){idb(function(db){try{var q=db.transaction('s').objectStore('s').get('latest');q.onsuccess=function(){cb(q.result)}}catch(e){}})}
/* Every save writes three copies: main, a second localStorage key, and IndexedDB. Empty states never overwrite the spare copies. */
function save(){
  var j=JSON.stringify(state);
  try{localStorage.setItem(KEY,j)}catch(e){toast('Could not save on this device. Copy a backup now.')}
  if(state.goals.length){try{localStorage.setItem(KEY+'.bak',j)}catch(e){}idbPut(j)}
}
var tt;
function toast(m){var t=document.getElementById('toast');document.getElementById('toastText').textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3500)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function today(){return fmtDate(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function money(n){var neg=n<0;n=Math.abs(n);return (neg?'-':'')+'$'+n.toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function sum(a){return a.reduce(function(t,x){return t+x.amount},0)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function find(id){for(var i=0;i<state.goals.length;i++)if(state.goals[i].id===id)return state.goals[i];return null}

/* Money to make = target + money spent. Per-day figure = what is still unmade, spread over the days left (today included). */
function calc(g){
  var t=today();
  var madeTotal=sum(g.made), spentTotal=sum(g.spent), miscTotal=sum(g.misc);
  var taxOnlyTotal=sum(g.taxonly);
  var taxTotal=sum(g.spent.filter(function(e){return e.tax}))+sum(g.misc.filter(function(e){return e.tax}))+taxOnlyTotal;
  var madeToday=sum(g.made.filter(function(e){return e.date===t}));
  var need=g.target+spentTotal+miscTotal;
  var daysLeft=Math.max(1,daysBetween(t,g.end)+1);
  var totalDays=Math.max(1,daysBetween(g.start,g.end)+1);
  var perDay=Math.max(0,(need-madeTotal)/daysLeft);
  var dayLeft=Math.max(0,Math.max(0,(need-(madeTotal-madeToday))/daysLeft)-madeToday);
  return {dayLeft:dayLeft,taxOnlyTotal:taxOnlyTotal,taxTotal:taxTotal,madeTotal:madeTotal,spentTotal:spentTotal,miscTotal:miscTotal,madeToday:madeToday,need:need,remaining:need-madeTotal,
    daysLeft:daysLeft,totalDays:totalDays,dailyNeed:need/totalDays,perDay:perDay,leftToday:perDay,
    pct:need>0?Math.min(100,Math.max(0,madeTotal/need*100)):0,over:daysBetween(t,g.end)<0};
}

function render(){
  var app=document.getElementById('app');
  app.innerHTML=view.page==='goal'?goalHtml():view.page==='stub'?stubHtml():view.page==='form'?formHtml():listHtml();
  window.scrollTo(0,0);
}

function listHtml(){
  var h='<div class="brand"><i></i><b>Account-a-Bill</b></div><h1>Goals <button class="sm" data-a="new">+ New goal</button></h1>';
  var lt=view.ltab||'goals';
  h+='<div class="tabs"><button class="sm'+(lt==='goals'?'':' ghost')+'" data-a="ltab" data-t="goals">Goals</button><button class="sm'+(lt==='combined'?'':' ghost')+'" data-a="ltab" data-t="combined">Combined</button><button class="sm'+(lt==='monthly'?'':' ghost')+'" data-a="ltab" data-t="monthly">Monthly</button></div>';
  if(lt==='monthly'){
    return h+monthlyHtml();
  }
  if(lt==='combined'){
    if(!state.goals.length)return h+'<div class="card mute">No goals yet. Add a goal to see combined totals.</div>';
    return h+combinedHtml();
  }
  if(!state.goals.length)h+='<div class="card mute">No goals yet. Tap “+ New goal”, enter how much you want to make and by when. Then log what you make and what you spend each day.</div>';
  state.goals.forEach(function(g){
    var c=calc(g);
    h+='<div class="card tap" data-a="open" data-id="'+esc(g.id)+'"><div class="row"><h2>'+esc(g.name)+(isOut(g)?'<span class="tag" style="color:#ffb347;border-color:#ffb347">Outgoing</span>':'')+'</h2><span class="mute">'+dueShort(g)+'</span></div>'+
      '<div class="row"><span class="mute">'+(isOut(g)?'Left to pay per day':'Left to make per day')+'</span><b class="'+(c.leftToday>0?'':'pos')+'">'+money(c.leftToday)+'</b></div>'+
      '<div class="bar"><i style="width:'+c.pct+'%"></i></div>'+
      '<div class="mute">'+money(c.madeTotal)+(isOut(g)?' paid of ':' made of ')+money(c.need)+'</div><div class="mute">Due '+fmtLong(g.end)+' · set for '+c.totalDays+' day'+(c.totalDays>1?'s':'')+'</div></div>';
  });
  if(view.recover){
    h+='<div class="card"><h2>Saved copy found</h2><div class="mute">A backup copy of your goals was found on this device ('+view.recover.goals.length+' goal'+(view.recover.goals.length>1?'s':'')+'). Restore it?</div><div class="btns"><button class="sm" data-a="recover">Restore my goals</button></div></div>';
  }
  if(state.goals.length){
    var lb=state.lastBackup,ago=lb?Math.floor((Date.now()-lb)/864e5):null;
    if(ago===null||ago>=7)h+='<div class="card"><h2>Back up your data</h2><div class="mute">'+(ago===null?'You have not saved a backup file yet.':'Last backup was '+ago+' days ago.')+' A file backup protects your goals if Safari clears this site’s data.</div><div class="btns"><button class="sm" data-a="dlBackup">Download backup file</button></div></div>';
  }
  h+='<div class="btns"><button class="ghost sm" data-a="backup">Backup / restore</button></div>';
  if(view.backup){
    var json=JSON.stringify(state);
    h+='<div class="card"><h2>Backup / restore</h2><div class="mute">Copy this text and keep it somewhere safe. To restore, paste a backup here and tap Restore.</div>'+
      '<textarea id="bk" spellcheck="false">'+esc(json)+'</textarea><div class="btns"><button class="sm" data-a="dlBackup">Download file</button><button class="sm" data-a="copyBk">Copy</button>'+
      '<button class="ghost sm" data-a="restore">Restore from text</button></div><label>Or load a backup file<input id="bkFile" type="file" accept=".json,application/json"></label></div>';
  }
  h+='<p class="mute">Your data stays in this browser on this device. Clearing Safari website data erases it, so keep a backup.</p>';
  return h;
}

/* Tax estimator: rates are editable estimates, not tax advice. State rates: flat/no-tax states per 2026 published rates; graduated states use a typical mid-bracket estimate. */
var TYPES={
  w2:{n:'W-2 employee',se:7.65,fica:true},
  nec:{n:'1099-NEC (independent contractor)',se:15.3,qbi:true},
  k:{n:'1099-K (gig work / payment platform)',se:15.3,qbi:true},
  misc:{n:'1099-MISC (other income)',se:0},
  self:{n:'Self-employed (no form)',se:15.3,qbi:true}
};
var STATES={AL:['Alabama',5],AK:['Alaska',0],AZ:['Arizona',2.5],AR:['Arkansas',3.9],CA:['California',6],CO:['Colorado',4.4],CT:['Connecticut',5],DE:['Delaware',5.5],DC:['District of Columbia',8.5],FL:['Florida',0],GA:['Georgia',4.99],HI:['Hawaii',7],ID:['Idaho',5.695],IL:['Illinois',4.95],IN:['Indiana',2.95],IA:['Iowa',3.8],KS:['Kansas',5.2],KY:['Kentucky',3.5],LA:['Louisiana',3],ME:['Maine',6.5],MD:['Maryland',5],MA:['Massachusetts',5],MI:['Michigan',4.25],MN:['Minnesota',6.8],MS:['Mississippi',4],MO:['Missouri',4.7],MT:['Montana',5],NE:['Nebraska',4],NV:['Nevada',0],NH:['New Hampshire',0],NJ:['New Jersey',5.5],NM:['New Mexico',4.9],NY:['New York',6],NC:['North Carolina',3.99],ND:['North Dakota',1.5],OH:['Ohio',2.75],OK:['Oklahoma',4],OR:['Oregon',8.75],PA:['Pennsylvania',3.07],RI:['Rhode Island',4.75],SC:['South Carolina',6],SD:['South Dakota',0],TN:['Tennessee',0],TX:['Texas',0],UT:['Utah',4.55],VT:['Vermont',6.5],VA:['Virginia',5.75],WA:['Washington',0],WV:['West Virginia',4.5],WI:['Wisconsin',5.3],WY:['Wyoming',0]};
var FLAT={AZ:1,CO:1,GA:1,ID:1,IL:1,IN:1,IA:1,KY:1,LA:1,MI:1,MS:1,NC:1,OH:1,PA:1,UT:1};

function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

function download(name,text,mime){
  function viaLink(){
    try{
      var b=new Blob([text],{type:mime||'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Downloaded '+name);
    }catch(e){copyText(text,'Download blocked here. Text copied instead.')}
  }
  try{
    if(window.claude&&window.claude.use){
      window.claude.use('downloads').then(function(d){
        if(!d){viaLink();return}
        d.save({filename:name,data:text}).then(function(){toast('Saved '+name)},function(err){
          if(err&&err.code==='declined')return;
          copyText(text,'Could not save a file here. Text copied instead.');
        });
      },viaLink);
      return;
    }
  }catch(e){}
  viaLink();
}
function copyText(t,msg){
  function fallback(){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');toast(msg||'Copied')}catch(e){toast('Could not copy')}document.body.removeChild(x)}
  try{navigator.clipboard.writeText(t).then(function(){toast(msg||'Copied')},fallback)}catch(e){fallback()}
}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:0}
function stubData(g,st){
  var inR=function(e){return e.date>=st.from&&e.date<=st.to};
  var made=g.made.filter(inR).sort(byDate);
  var exp=g.spent.map(function(e){return {date:e.date,amount:e.amount,note:e.note,tax:!!e.tax,kind:'Spent'}})
    .concat(g.misc.map(function(e){return {date:e.date,amount:e.amount,note:e.note,tax:!!e.tax,kind:'Misc'}})).filter(inR).sort(byDate);
  var tonly=g.taxonly.filter(inR).sort(byDate),tox=sum(tonly);
  var gross=sum(made),ded=sum(exp.filter(function(e){return e.tax})),oth=sum(exp.filter(function(e){return !e.tax}));
  return {made:made,exp:exp,tonly:tonly,tox:tox,gross:gross,ded:ded,oth:oth,net:gross-ded-oth,taxable:gross-ded-tox};
}

  else if(a==='delManual'){
    var dk='man'+el.dataset.id;
    if(view.armed!==dk){view.armed=dk;var ymD=window.scrollY;render();window.scrollTo(0,ymD);return}
    state.manual=state.manual.filter(function(x){return x.id!==el.dataset.id});view.armed=null;save();var ymF=window.scrollY;render();window.scrollTo(0,ymF);
  }
  else if(a==='goalMo'){var gm=find(el.dataset.id);if(gm){gm.inMonthly=!gm.inMonthly;save();var ygm=window.scrollY;render();window.scrollTo(0,ygm)}}
  else if(a==='mtoggle'){view.mo=view.mo||{};view.mo[el.dataset.k]=!view.mo[el.dataset.k];var ym0=window.scrollY;render();window.scrollTo(0,ym0)}
  else if(a==='mfilter'){view.mf=el.dataset.f;var ym1=window.scrollY;render();window.scrollTo(0,ym1)}
  else if(a==='psOpen'||a==='mStub'){
    var mk=a==='psOpen'?val('psMonth'):el.dataset.k,my=+mk.slice(0,4),mm2=+mk.slice(5,7);
    view.page='list';view.ltab='monthly';view.id=null;view.mps=true;view.psm=mk;view.stub={from:mk+'-01',to:fmtDate(new Date(my,mm2,0))};render();
    var pc=document.getElementById('psCard');if(pc)pc.scrollIntoView();
  }
  else if(a==='psClose'){view.mps=null;view.stub=null;render()}
  else if(a==='qAdd'){
    var qg=find(val('qGoal')),qt=val('qType'),qa=num('qAmt');
    if(!qg){toast('Pick a goal.');return}
    if(qa==null||qa<=0){toast('Enter an amount above zero.');return}
    var qe={id:uid(),date:val('qDate')||today(),amount:qa,note:val('qNote').trim(),mo:true};
    if(qt==='spent'||qt==='misc')qe.tax=document.getElementById('qTax').checked;
    if(qt==='taxonly')qe.tax=true;
    qg[qt].push(qe);save();var yq2=window.scrollY;render();window.scrollTo(0,yq2);toast('Entry added to '+qg.name);
  }
  else if(a==='ltab'){view.ltab=el.dataset.t;render()}
  else if(a==='tab'){view.tab=el.dataset.t;view.armed=null;view.editing=null;render()}
  else if(a==='editEntry'){view.editing=el.dataset.k+el.dataset.id;var y0=window.scrollY;render();window.scrollTo(0,y0)}
  else if(a==='cancelEdit'){view.editing=null;var y1=window.scrollY;render();window.scrollTo(0,y1)}
  else if(a==='saveEdit'){
    var ea=num('eAmt'),ed=val('eDate');
    if(ea==null||ea<=0){toast('Enter an amount above zero.');return}
    if(!ed){toast('Pick a date.');return}
    var el2=el.dataset.k==='m'?g.made:el.dataset.k==='x'?g.misc:el.dataset.k==='t'?g.taxonly:g.spent;
    for(var q=0;q<el2.length;q++)if(el2[q].id===el.dataset.id){
      el2[q].amount=ea;el2[q].date=ed;el2[q].note=val('eNote').trim();
      if(el.dataset.k==='s'||el.dataset.k==='x')el2[q].tax=document.getElementById('eTax').checked;
      break}
    view.editing=null;save();var y2=window.scrollY;render();window.scrollTo(0,y2);toast('Entry updated');
  }
  else if(a==='filter'){view.filter=el.dataset.f;view.editing=null;render()}
  else if(a==='stub'){var t0=today();view={page:'stub',id:view.id,stub:{from:g.start,to:(t0<g.start||t0>g.end)?g.end:t0}};render()}
  else if(a==='genStub'){
    var f=val('stubFrom'),to=val('stubTo');
    if(!f||!to||daysBetween(f,to)<0){toast('Pick a valid date range.');return}
    var pr=state.profile;
    pr.name=val('stubName').trim();pr.payer=val('stubPayer').trim();pr.addr=val('stubAddr').trim();pr.payerAddr=val('stubPayerAddr').trim();
    pr.tin4=val('stubTin').replace(/\D/g,'').slice(-4);pr.method=val('stubMethod').trim();save();
    view.stub={from:f,to:to,payDate:val('stubPayDate')||today(),withheld:Math.max(0,num('stubWithheld')||0)};render();toast('Paystub updated');
  }
  else if(a==='printStub'){try{window.print()}catch(e){toast('Printing is not available here.')}}
  else if(a==='csvStub'){download('paystub-'+view.stub.from+'-to-'+view.stub.to+'.csv',stubCsv(monthGoal(),view.stub))}
  else if(a==='copyStub'){copyText(stubCsv(monthGoal(),view.stub),'Paystub CSV copied')}
  else if(a==='taxCsv'){download('tax-deductions-'+today()+'.csv',taxCsv(view.mps?monthGoal():g))}
  else if(a==='toggleTax'){
    var tl=el.dataset.k==='x'?g.misc:g.spent;
    for(var j=0;j<tl.length;j++)if(tl[j].id===el.dataset.id){tl[j].tax=!tl[j].tax;break}
    save();var y=window.scrollY;render();window.scrollTo(0,y);
  }
  else if(a==='saveGoal'){
    var name=val('fname').trim(),tg=num('ftarget'),s=val('fstart'),e=val('fend');
    if(!name||tg==null||!s||!e){toast('Fill in name, amount, start and end.');return}
    if(daysBetween(s,e)<0){toast('End date must be on or after the start date.');return}
    if(view.form.id){var x=find(view.form.id);x.name=name;x.kind=val('fkind')||'in';x.target=tg;x.start=s;x.end=e;view={page:'goal',id:x.id}}
    else{var n={id:uid(),name:name,kind:val('fkind')||'in',target:tg,start:s,end:e,made:[],spent:[],misc:[],taxonly:[],taxpay:[],subs:[]};state.goals.push(n);view={page:'goal',id:n.id}}
    save();render();
  }
  else if(a==='addMade'||a==='addSpent'||a==='addMisc'||a==='addTaxOnly'){
    var p=a==='addMade'?'made':a==='addMisc'?'misc':a==='addTaxOnly'?'taxonly':'spent',amt=num(p+'Amt');
    if(amt==null||amt<=0){toast('Enter an amount above zero.');return}
    var tx=document.getElementById(p+'Tax');
    g[p].push({id:uid(),date:val(p+'Date')||today(),amount:amt,note:val(p+'Note').trim(),tax:p==='taxonly'||!!(tx&&tx.checked)});
    save();render();toast((p==='made'?(isOut(g)?'Payment added':'Money made added'):p==='misc'?'Misc expense added':p==='taxonly'?'Tax-only deduction added':'Money spent added')+(p==='made'?allocNote(g):''));
  }
  else if(a==='del'){
    var key=el.dataset.k+el.dataset.id;
    if(view.armed!==key){view.armed=key;render();return}
    var list=el.dataset.k==='m'?g.made:el.dataset.k==='x'?g.misc:el.dataset.k==='t'?g.taxonly:g.spent;
    for(var i=0;i<list.length;i++)if(list[i].id===el.dataset.id){list.splice(i,1);break}
    view.armed=null;save();render();
  }
  else if(a==='delGoal'){
    if(view.armed!=='goal'){view.armed='goal';render();return}
    state.goals=state.goals.filter(function(x){return x.id!==view.id});save();view={page:'list'};render();
  }
});

function refreshTax(){
  var g=view.id?find(view.id):null,b1=document.getElementById('taxRes'),b2=document.getElementById('taxResAll');
  if(b1&&g){var ti=taxInfo(g);b1.innerHTML=ti.type&&ti.state?taxResHtml([g]):'<div class="mute">Choose a worker type and a state to see your estimated taxes.</div>'}
  if(b2)b2.innerHTML=taxResHtml(state.goals);
}
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el&&el.id==='bkFile'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){var ta=document.getElementById('bk');if(ta){ta.value=fr.result;toast('File loaded. Tap Restore from text.')}};fr.readAsText(el.files[0]);return}
  if(!el.dataset)return;
  if(el.dataset.tp==='filing'){state.profile.filing=el.value;save();var y0=window.scrollY;render();window.scrollTo(0,y0);return}
  if(el.dataset.tx!=='type'&&el.dataset.tx!=='state')return;
  var g=find(view.id);if(!g)return;var ti=taxInfo(g);
  if(el.dataset.tx==='type'){ti.type=el.value;if(TYPES[el.value])ti.se=TYPES[el.value].se}
  else{ti.state=el.value;ti.st='';ti.stManual=false}
  save();var y=window.scrollY;render();window.scrollTo(0,y);
});
document.addEventListener('input',function(ev){
  var el=ev.target;if(!el.dataset)return;var n=parseFloat(el.value);
  if(el.id==='mSearch'){view.mq=el.value;var mp=el.selectionStart,my2=window.scrollY;render();window.scrollTo(0,my2);var m2=document.getElementById('mSearch');if(m2){m2.focus();try{m2.setSelectionRange(mp,mp)}catch(x){}}return}
  if(el.id==='hSearch'){view.q=el.value;var pos=el.selectionStart,y=window.scrollY;render();window.scrollTo(0,y);var e2=document.getElementById('hSearch');if(e2){e2.focus();try{e2.setSelectionRange(pos,pos)}catch(x){}}return}
  if(el.dataset.tp==='credits'||el.dataset.tp==='careExp'||el.dataset.tp==='adj'){state.profile[el.dataset.tp]=isFinite(n)?Math.max(0,n):0;save();refreshTax();return}
  if(el.dataset.tp==='kids'||el.dataset.tp==='otherDeps'||el.dataset.tp==='careKids'){state.profile[el.dataset.tp]=isFinite(n)?Math.max(0,Math.floor(n)):0;save();refreshTax();return}
  if(!el.dataset.tx||el.dataset.tx==='type'||el.dataset.tx==='state')return;
  var g=find(view.id);if(!g)return;var ti=taxInfo(g);
  ti[el.dataset.tx]=isFinite(n)?n:'';if(el.dataset.tx==='st')ti.stManual=isFinite(n);save();refreshTax();
});
if(!state.goals.length){idbGet(function(j){try{var d=JSON.parse(j);if(d&&d.goals&&d.goals.length&&!state.goals.length){view.recover=d;if(view.page==='list')render()}}catch(e){}})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view.page==='list'&&!view.backup)render()});
render();
})();
</script>


</body></html>
